<body>
<header><p class="label">ESCENA 2 · LA MÁQUINA HABITADA</p>
<h1>Construida por capas.<br>Una decisión por capa.</h1>
<p class="lede">Cada cuadro agrega una capa y conserva las anteriores. Si una capa no se justifica sola, sobra.</p></header>
<main>
<figure><img src="maquina-base.svg" width="1000" height="760" alt="La máquina tiene piso: la retícula da escala y horizonte."><figcaption><strong>CAPA 1 · BASE</strong> · La máquina tiene piso: la retícula da escala y horizonte.</figcaption></figure>
<figure><img src="maquina-structure.svg" width="1000" height="760" alt="Tres pisos, cuatro columnas, espesor visible: se ve el interior."><figcaption><strong>CAPA 2 · ESTRUCTURA</strong> · Tres pisos, cuatro columnas, espesor visible: se ve el interior.</figcaption></figure>
<figure><img src="maquina-stations.svg" width="1000" height="760" alt="Una plataforma por puesto. Cuatro en total, repartidas en los tres pisos."><figcaption><strong>CAPA 3 · ESTACIONES</strong> · Una plataforma por puesto. Cuatro en total, repartidas en los tres pisos.</figcaption></figure>
<figure><img src="maquina-operators.svg" width="1000" height="760" alt="Dos puntos cada uno. Diminutos contra la máquina: ahí está el argumento de escala."><figcaption><strong>CAPA 4 · OPERARIOS</strong> · Dos puntos cada uno. Diminutos contra la máquina: ahí está el argumento de escala.</figcaption></figure>
<figure><img src="maquina-route.svg" width="1000" height="760" alt="La ficha va de puesto en puesto. Trayecto punteado, sin flechas."><figcaption><strong>CAPA 5 · RECORRIDO</strong> · La ficha va de puesto en puesto. Trayecto punteado, sin flechas.</figcaption></figure>
<figure><img src="maquina-tray.svg" width="1000" height="760" alt="El último la deja acá. Tres fichas ya entregadas."><figcaption><strong>CAPA 6 · BANDEJA</strong> · El último la deja acá. Tres fichas ya entregadas.</figcaption></figure>
</main>
<footer><p class="label">Prueba de la escena: se entiende en tres segundos y sin palabras. Si no, se corrige la capa, no el texto.</p></footer>
