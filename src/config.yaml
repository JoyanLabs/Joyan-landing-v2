site:
  name: Joyan
  # Pre-launch placeholder (F4): swap to the production domain before launch.
  site: 'https://joyan.dev'
  base: '/'
  trailingSlash: false

  # googleSiteVerificationId: false

# Default SEO metadata (ES defaults; EN overrides come from the EN locale module)
metadata:
  title:
    default: Joyan
    template: '%s — Joyan'
  # Site-level fallback. The locale modules (`src/lib/i18n/es.ts` / `en.ts`)
  # are authoritative for the landings; keep this string aligned with `es.meta`.
  description: 'Joyan es una cooperativa centrada en las personas. Construimos agentes que trabajan dentro de límites acordados y sistemas conectados que registran lo que ocurre en el mundo físico, para que la información de una operación se convierta en decisiones revisables.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Joyan
    images:
      - url: '/assets/brand/og-default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@joyanlabs'
    site: '@joyanlabs'
    cardType: summary_large_image

i18n:
  language: es
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'dark:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
