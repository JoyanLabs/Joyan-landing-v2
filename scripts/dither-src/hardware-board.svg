<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Abstract PCB illustration source art (P3.2): conceptual hardware board,
       no real device. Consumed by scripts/generate-dither.mjs (ADR-1). -->
  <rect width="1024" height="1024" fill="#0B0B0C"/>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#F4F2ED" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#grid)"/>

  <!-- Board outline -->
  <rect x="32" y="32" width="960" height="960" fill="none" stroke="#F4F2ED" stroke-opacity="0.28" stroke-width="3"/>
  <rect x="56" y="56" width="912" height="912" fill="none" stroke="#F4F2ED" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Mounting holes (corners) -->
  <g fill="none" stroke="#F4F2ED" stroke-opacity="0.35" stroke-width="2">
    <rect x="72" y="72" width="48" height="48"/>
    <rect x="904" y="72" width="48" height="48"/>
    <rect x="72" y="904" width="48" height="48"/>
    <rect x="904" y="904" width="48" height="48"/>
  </g>
  <g fill="#F4F2ED" fill-opacity="0.5">
    <circle cx="96" cy="96" r="8"/>
    <circle cx="928" cy="96" r="8"/>
    <circle cx="96" cy="928" r="8"/>
    <circle cx="928" cy="928" r="8"/>
  </g>

  <!-- Core IC package -->
  <rect x="392" y="392" width="240" height="240" fill="#0B0B0C" stroke="#F4F2ED" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="416" y="416" width="192" height="192" fill="none" stroke="#F4F2ED" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- IC pins -->
  <g fill="#F4F2ED" fill-opacity="0.4">
    <rect x="432" y="376" width="16" height="16"/>
    <rect x="472" y="376" width="16" height="16"/>
    <rect x="512" y="376" width="16" height="16"/>
    <rect x="552" y="376" width="16" height="16"/>
    <rect x="592" y="376" width="16" height="16"/>
    <rect x="432" y="632" width="16" height="16"/>
    <rect x="472" y="632" width="16" height="16"/>
    <rect x="512" y="632" width="16" height="16"/>
    <rect x="552" y="632" width="16" height="16"/>
    <rect x="592" y="632" width="16" height="16"/>
    <rect x="376" y="432" width="16" height="16"/>
    <rect x="376" y="472" width="16" height="16"/>
    <rect x="376" y="512" width="16" height="16"/>
    <rect x="376" y="552" width="16" height="16"/>
    <rect x="376" y="592" width="16" height="16"/>
    <rect x="632" y="432" width="16" height="16"/>
    <rect x="632" y="472" width="16" height="16"/>
    <rect x="632" y="512" width="16" height="16"/>
    <rect x="632" y="552" width="16" height="16"/>
    <rect x="632" y="592" width="16" height="16"/>
  </g>

  <!-- Traces from IC to edge pads -->
  <g fill="none" stroke="#F4F2ED" stroke-width="2.5">
    <path d="M440 392 V280 H200 V160" stroke-opacity="0.3"/>
    <path d="M520 392 V240 H824 V160" stroke-opacity="0.22"/>
    <path d="M600 392 V320 H960" stroke-opacity="0.18"/>
    <path d="M440 632 V744 H200 V864" stroke-opacity="0.28"/>
    <path d="M520 632 V784 H824 V864" stroke-opacity="0.2"/>
    <path d="M600 632 V704 H960" stroke-opacity="0.16"/>
    <path d="M392 440 H280 V200" stroke-opacity="0.26"/>
    <path d="M392 520 H240 V824" stroke-opacity="0.2"/>
    <path d="M632 440 H744 V200" stroke-opacity="0.22"/>
    <path d="M632 520 H784 V824" stroke-opacity="0.16"/>
  </g>

  <!-- Edge pads -->
  <g fill="none" stroke="#F4F2ED" stroke-opacity="0.35" stroke-width="2">
    <rect x="32" y="488" width="56" height="24"/>
    <rect x="936" y="488" width="56" height="24"/>
    <rect x="488" y="32" width="24" height="56"/>
