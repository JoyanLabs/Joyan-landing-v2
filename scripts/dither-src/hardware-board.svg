    <rect x="168" y="864" width="64" height="24"/>
    <rect x="792" y="864" width="64" height="24"/>
  </g>

  <!-- Vias -->
  <g fill="#F4F2ED">
    <circle cx="200" cy="160" r="7" fill-opacity="0.5"/>
    <circle cx="824" cy="160" r="7" fill-opacity="0.5"/>
    <circle cx="200" cy="864" r="7" fill-opacity="0.5"/>
    <circle cx="824" cy="864" r="7" fill-opacity="0.5"/>
    <circle cx="512" cy="160" r="7" fill-opacity="0.45"/>
    <circle cx="512" cy="864" r="7" fill-opacity="0.45"/>
    <circle cx="160" cy="512" r="7" fill-opacity="0.45"/>
    <circle cx="864" cy="512" r="7" fill-opacity="0.45"/>
    <circle cx="320" cy="320" r="4" fill-opacity="0.3"/>
    <circle cx="704" cy="320" r="4" fill-opacity="0.3"/>
    <circle cx="320" cy="704" r="4" fill-opacity="0.3"/>
    <circle cx="704" cy="704" r="4" fill-opacity="0.3"/>
    <circle cx="128" cy="256" r="4" fill-opacity="0.25"/>
    <circle cx="896" cy="256" r="4" fill-opacity="0.25"/>
    <circle cx="128" cy="768" r="4" fill-opacity="0.25"/>
    <circle cx="896" cy="768" r="4" fill-opacity="0.25"/>
  </g>

  <!-- Decoupling caps near IC -->
  <g fill="none" stroke="#F4F2ED" stroke-opacity="0.3" stroke-width="2">
    <rect x="336" y="336" width="40" height="20"/>
    <rect x="648" y="336" width="40" height="20"/>
    <rect x="336" y="668" width="40" height="20"/>
    <rect x="648" y="668" width="40" height="20"/>
  </g>

  <!-- Corner accents -->
  <g stroke="#F4F2ED" stroke-opacity="0.12" stroke-width="2">
    <line x1="136" y1="136" x2="200" y2="200"/>
    <line x1="888" y1="136" x2="824" y2="200"/>
    <line x1="136" y1="888" x2="200" y2="824"/>
    <line x1="888" y1="888" x2="824" y2="824"/>
  </g>

  <!-- Field dots -->
  <g fill="#F4F2ED" fill-opacity="0.2">
    <circle cx="300" cy="120" r="2"/>
    <circle cx="724" cy="120" r="2"/>
    <circle cx="120" cy="660" r="2"/>
    <circle cx="904" cy="660" r="2"/>
    <circle cx="660" cy="780" r="2"/>
    <circle cx="364" cy="780" r="2"/>
    <circle cx="780" cy="360" r="2"/>
    <circle cx="244" cy="360" r="2"/>
    <circle cx="244" cy="644" r="2"/>
    <circle cx="780" cy="644" r="2"/>
