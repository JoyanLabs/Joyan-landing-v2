    <circle cx="1040" cy="300" r="1.5"/>
    <circle cx="1120" cy="420" r="1.5"/>
    <circle cx="560" cy="640" r="1.5"/>
    <circle cx="980" cy="720" r="1.5"/>
    <circle cx="140" cy="520" r="1.5"/>
    <circle cx="1520" cy="380" r="1.5"/>
    <circle cx="700" cy="140" r="1.5"/>
    <circle cx="900" cy="700" r="1.5"/>
    <circle cx="440" cy="520" r="1.5"/>
    <circle cx="1500" cy="820" r="1.5"/>
    <circle cx="760" cy="860" r="1.5"/>
