<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Abstract agent-network source art (P3.2): dark, technical, procedural.
       No stock photos, no logos, no UI mockups. Consumed by
       scripts/generate-dither.mjs (ADR-1 pipeline). -->
  <rect width="1600" height="900" fill="#0B0B0C"/>
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#F4F2ED" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Beacon rings -->
  <g fill="none" stroke="#F4F2ED" stroke-opacity="0.22" stroke-width="1.5">
    <circle cx="160" cy="160" r="45"/>
    <circle cx="160" cy="160" r="70" stroke-opacity="0.14"/>
    <circle cx="1180" cy="700" r="50"/>
    <circle cx="1180" cy="700" r="78" stroke-opacity="0.12"/>
    <circle cx="860" cy="210" r="36" stroke-opacity="0.2"/>
  </g>

  <!-- Long-range orthogonal traces (PCB-style agent wiring) -->
  <g fill="none" stroke="#F4F2ED" stroke-opacity="0.35" stroke-width="2">
    <path d="M400 200 H700 V380"/>
    <path d="M960 480 H1180 V560"/>
    <path d="M800 450 V300 H720"/>
    <path d="M300 820 V760 H340"/>
    <path d="M260 380 H640 V500"/>
