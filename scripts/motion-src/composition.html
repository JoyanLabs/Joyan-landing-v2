<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Joyan — El caret</title>
    <style>
      /* Brand tokens (docs/DESIGN.md — Visual tokens). Radius 0, no italics,
         no purple gradients, two-value dither palette only. */
      @font-face {
        font-family: 'Archivo';
        src: url('./archivo.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-stretch: 25% 200%;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('./mono.woff2') format('woff2-variations');
        font-weight: 100 800;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #0b0b0c; overflow: hidden; }
      body { width: 1920px; height: 1080px; font-family: 'Archivo', sans-serif; }
      #stage { position: absolute; inset: 0; }
      svg { position: absolute; inset: 0; display: block; }
    </style>
  </head>
  <body>
    <div id="stage">
      <svg id="world" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
    </div>
    <script type="module">
      import * as F from './film.mjs';

      const { clamp, seg, spring, springBack, outCubic, outQuart, outExpo,
              inOutCubic, shake } = F;
      const lerp = (a, b, p) => a + (b - a) * p;

      const NS = 'http://www.w3.org/2000/svg';
      const W = 1920, H = 1080;
      const INK = '#0b0b0c', INK900 = '#121214', BONE = '#f4f2ed',
            BONE100 = '#e8e6e1', PLOMO = '#8a8a90', ACCENT = '#ffb000',
            HAIR = 'rgba(255,255,255,0.16)';

      const root = document.getElementById('world');
      const el = (tag, attrs = {}) => {
        const n = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
        return n;
      };
      const set = (n, attrs) => {
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
      };
      const hair = { stroke: HAIR, 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' };
      // The film's own lines are brighter than the UI hairline. At 1920x1080
      // a 16%-alpha 1px line disappears: the first draft of this film had an
      // invisible network for five seconds and the oracle caught it.
      const wire = { stroke: 'rgba(255,255,255,0.45)', 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke' };

      const defs = el('defs', {});
      const typedClip = el('clipPath', { id: 'typedClip' });
      typedClip.appendChild(el('rect', { x: 580, y: 420, width: 0, height: 110 }));
      defs.appendChild(typedClip);
      root.appendChild(defs);

      const CAM = el('g', {});
      root.appendChild(CAM);

      // ---- Layers. Built once; seek(t) only mutates attributes, so nothing
      // accumulates across frames and the DOM stays diff-stable.
      const L = {};
      const add = (k, node) => { L[k] = node; CAM.appendChild(node); return node; };

      add('ground', el('rect', { x: 0, y: 0, width: W, height: H, fill: INK }));

      const grid = add('grid', el('g', { opacity: 0 }));
      const gridWire = { stroke: 'rgba(255,255,255,0.20)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' };
      for (let i = 0; i <= 16; i++)
        grid.appendChild(el('line', { x1: i * 120, y1: 0, x2: i * 120, y2: H, ...gridWire }));
      for (let j = 0; j <= 9; j++)
        grid.appendChild(el('line', { x1: 0, y1: j * 120, x2: W, y2: j * 120, ...gridWire }));

      // The rule lands on grid row 4 (y = 4 * 120), so "the rule survives as
      // a grid line" is literally true rather than merely claimed.
      add('rule', el('rect', { x: W / 2, y: 478.5, width: 0, height: 3, fill: BONE }));

      L.typed = add('typed', el('text', {
        x: 600, y: 496, fill: BONE100, 'clip-path': 'url(#typedClip)',
        'font-family': 'JetBrains Mono, monospace', 'font-size': 44,
        'letter-spacing': 2,
      }));
      L.typed.textContent = '> ' + F.TYPED;

      add('caret', el('rect', { x: 0, y: 536, width: 28, height: 58, fill: ACCENT }));

      L.edges = add('edges', el('g', {}));
      const edgeEls = F.EDGES.map((_, i) =>
        L.edges.appendChild(el('line', {
          ...wire,
          'stroke-dasharray': i % 2 === 0 ? 'none' : '6 7', opacity: 0,
        })));

      L.rings = add('rings', el('g', {}));
      const ringEls = F.NODES.map(() => L.rings.appendChild(el('circle', {
        fill: 'none', stroke: ACCENT, 'stroke-width': 2,
        'vector-effect': 'non-scaling-stroke', opacity: 0, r: 0,
      })));

      L.nodes = add('nodes', el('g', {}));
      const nodeEls = F.NODES.map((n) => L.nodes.appendChild(el('circle', {
        cx: n.x, cy: n.y, r: F.CORE.satellite, fill: INK900,
        stroke: 'rgba(255,255,255,0.55)', 'stroke-width': 1.5,
        'vector-effect': 'non-scaling-stroke',
      })));
      const glow = L.nodes.appendChild(el('circle', {
        cx: F.CORE.x, cy: F.CORE.y, r: F.CORE.coreLit, fill: ACCENT, opacity: 0,
      }));

      L.field = add('field', el('g', { opacity: 0 }));
      L.fieldCells = [];
      // 24px cells, not 60: the field has to read as dither at the scale the
      // camera holds, not as a checkerboard of grey blocks.
      const COLS = 80, ROWS = 45, CELL = 24;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const rect = el('rect', { x: c * CELL, y: r * CELL, width: CELL, height: CELL, opacity: 0 });
          L.field.appendChild(rect);
          L.fieldCells.push({
            rect,
            cx: c * CELL + CELL / 2,
            cy: r * CELL + CELL / 2,
            // Bayer threshold: the cell lights when local density exceeds it.
            threshold: (F.BAYER8[r % 8][c % 8] + 0.5) / 64,
            grain: hash2(c * CELL + CELL / 2, r * CELL + CELL / 2),
          });
        }
      }

      // No wordmark, no letters, no logo lockup. The film is carried entirely
      // by one amber block and hairlines, and it ends on the same block it
      // opened with — which makes the loop seamless for a background video.

      // ---- Final hairline: one 1px rule drawn under the resting block.
      add('rule2', el('rect', { x: (W - 420) / 2, y: 662, width: 0, height: 1, fill: HAIR }));

      // Seeded grain — deterministic. No Math.random anywhere in the film.
      function hash2(x, y) {
        const s = Math.sin(x * 0.1271 + y * 0.3117) * 43758.5453123;
        return s - Math.floor(s);
      }

      const CHAR_ADV = 26.5;   // JetBrains Mono advance at 44px + tracking
      const PROMPT_W = 60;     // the "> " prompt glyph
      const CURSOR_X = 600 + PROMPT_W;

      /** How far the core has unrolled into the field — needed before the
       *  glow is written, so it is read from the clock rather than a local. */
      const unrollProbe = (t) => seg(seg(t, 10.6, 12.6), 0, 0.7);

      // =====================================================================
      // seek(t) — the whole film is a pure function of t.
      // =====================================================================
      window.__seek = (t) => {
        // ---- Visibility windows.
        // Written explicitly rather than left to emerge from the beat maths,
        // because the film's loop contract requires the last frame to equal
        // the first. Anything left implicit drifts and breaks the seam.
        const win = (a, b, f = 0.3) => clamp(seg(t, a - f, a)) * (1 - clamp(seg(t, b, b + f)));
        const wGrid = win(4.1, 13.0, 0.45);
        const wSat = win(4.9, 12.2, 0.35);
        const wEdge = win(5.1, 10.7, 0.3);
        const wCore = win(5.0, 12.9, 0.35);
        const wRule = win(4.25, 12.5, 0.4);

        const pWrites = seg(t, 2.2, 3.9);
        const pCollapse = seg(t, 3.9, 4.6);
        const pSignals = seg(t, 4.6, 8.2);
        const pConverge = seg(t, 8.2, 10.6);
        const pField = seg(t, 10.6, 12.6);
        const pResolve = seg(t, 12.6, 14.0);
        const pSeal = seg(t, 14.0, 15.0);

        // ---- One camera, continuous, never a cut.
        const cam = F.cameraAt(t);
        const op = F.operatorAt(t);
        set(CAM, {
          transform:
            `translate(${(cam.x + op.x).toFixed(3)} ${(cam.y + op.y).toFixed(3)}) ` +
            `scale(${cam.scale.toFixed(4)}) translate(${-F.CORE.x} ${-F.CORE.y})`,
        });

        // ---- Beats 0-1: rest, then the caret writes the line.
        const written = Math.floor(outQuart(pWrites) * F.TYPED.length);
        // Nothing is on screen at t=0 except the caret, and nothing is on
        // screen at t=end except the caret. That is the whole loop contract.
        const typedW = pWrites > 0 ? PROMPT_W + written * CHAR_ADV : 0;
        set(typedClip.firstChild, { width: typedW });
        const cursorX = CURSOR_X + written * CHAR_ADV;

        // Blink through the rest, then hold solid. The cut-off is 2.1, not
        // 2.2: at t = 66/30 the comparison t < 2.2 is true in floating point
        // (66/30 lands just under 2.2), so the caret was still blinking on
        // the first frame of the typing beat. Stopping early also reads
        // better — the block settles before it starts typing.
        const blink = t < 2.1 ? (Math.floor(t * 1.55) % 2 === 0 ? 1 : 0.2) : 1;

        // ---- Beat 2: the typed line collapses into a rule; the rule opens
        // into the grid. Strictly sequenced — the text is gone before the
        // rule grows, so the two never overlap on screen.
        const collapse = inOutCubic(pCollapse);
        const ruleW = lerp(typedW, W, outCubic(seg(pCollapse, 0.32, 1)));
        set(L.typed, { opacity: (1 - seg(pCollapse, 0, 0.34)).toFixed(3) });
        set(L.rule, {
          x: lerp(600, (W - ruleW) / 2, seg(pCollapse, 0.32, 1)).toFixed(1),
          y: lerp(482, 478.5, seg(pCollapse, 0, 1)).toFixed(1),
          width: ruleW.toFixed(1),
          opacity: wRule.toFixed(3),
        });
        set(grid, { opacity: (outCubic(pCollapse) * wGrid).toFixed(3) });

        // ---- Beat 3: seven signals land on grid intersections; edges draw.
        // Staggered, so the cadence never becomes uniform.
        const conv = outQuart(pConverge);
        const slide = 1 - conv * 0.72;   // orbit -> tight ring

        for (let i = 0; i < 6; i++) {
          const n = F.NODES[i + 1];
          const nx = F.CORE.x + (n.x - F.CORE.x) * slide;
          const ny = F.CORE.y + (n.y - F.CORE.y) * slide;
          const land = springBack(seg(t, F.LAND[i], F.LAND[i] + 0.6), 2.6, 0.5);

          set(nodeEls[i + 1], {
            cx: nx.toFixed(2), cy: ny.toFixed(2),
            r: (F.CORE.satellite * (0.18 + 0.82 * land)).toFixed(2),
            opacity: (clamp(land * 1.5) * wSat).toFixed(3),
          });

          // Contact ring: cause is visible, the effect is not a surprise.
          const rp = seg(t, F.LAND[i], F.LAND[i] + 0.95);
          set(ringEls[i + 1], {
            cx: nx.toFixed(2), cy: ny.toFixed(2),
            r: (F.CORE.satellite + outQuart(rp) * 120).toFixed(2),
            opacity: ((1 - outCubic(rp)) * 0.9 * clamp(rp * 9)).toFixed(3),
          });

          // Edges stay welded to the moving nodes.
          const len = Math.hypot(nx - F.CORE.x, ny - F.CORE.y);
          const d = outCubic(seg(t, 4.95 + i * 0.3, 5.6 + i * 0.3));
          set(edgeEls[i], {
            x1: F.CORE.x, y1: F.CORE.y, x2: nx.toFixed(2), y2: ny.toFixed(2),
            'stroke-dashoffset': (i % 2 === 0 ? len * (1 - d) : 0).toFixed(2),
            opacity: (clamp(d * 2.2) * wEdge).toFixed(3),
          });
        }

        // ---- Beat 4: converge. Exactly one amber node (docs/DESIGN.md).
        const ignite = outExpo(seg(t, 9.5, 10.4));
        const coreR = lerp(F.CORE.coreIdle, F.CORE.coreLit, spring(ignite, 2.4, 0.9));
        set(nodeEls[0], {
          r: coreR.toFixed(2),
          fill: ignite > 0.02 ? ACCENT : INK900,
          stroke: ignite > 0.02 ? 'none' : 'rgba(255,255,255,0.55)',
          'stroke-width': ignite > 0.02 ? 0 : 1.5,
          opacity: wCore.toFixed(3),
        });
        set(glow, {
          r: (coreR * 1.06).toFixed(2),
          opacity: (clamp(ignite * wCore) * 0.45 * (1 - unrollProbe(t))).toFixed(3),
        });

        // The caret is now the core. One element, five roles across the film.
        const toCore = inOutCubic(seg(t, 9.05, 9.8));
        const rise = spring(seg(pSeal, 0, 0.5), 2.8, 1);
        // Home is reached at 90% of the closing beat, not at 100%: the last
        // ~0.15 s is a dead hold, which both the rhythm contract wants and
        // the loop seam needs (a return that lands a third of a pixel short
        // shows up as a lit edge column between the last frame and the first).
        const home = inOutCubic(seg(pSeal, 0.45, 0.9));
        // `rise` is scoped to the closing beat only. Applied unconditionally
        // it is zero at t=0, which erases the caret from the first frame and
        // puts a visible hole in the loop.
        const sizeK = lerp(1, rise, clamp(seg(t, 14.0, 14.02)));
        // The caret yields to the field, then comes back for the rest. Both
        // terms are needed: without the second one the block never returns
        // and the loop seam shows a caret missing from the last frame.
        const caretOpacity = Math.max(clamp(1 - pField * 1.05), outCubic(seg(pSeal, 0.18, 0.62)));
        set(L.caret, {
          x: lerp(lerp(cursorX, F.CORE.x - coreR * 0.19, toCore), CURSOR_X, home).toFixed(1),
          y: lerp(lerp(460, F.CORE.y - coreR * 0.39, toCore), 460, home).toFixed(1),
          width: (lerp(lerp(28, coreR * 0.38, toCore), 28, home) * sizeK).toFixed(1),
          height: (lerp(lerp(58, coreR * 0.78, toCore), 58, home) * sizeK).toFixed(1),
          opacity: (caretOpacity * blink).toFixed(3),
        });

        // ---- Beats 5-6: the core unrolls into a dither field, and the field
        // COLLAPSES back into a single point. No letters resolve out of it:
        // the field simply folds back into the block that started the film.
        const unroll = seg(pField, 0, 0.7);
        const fold = outQuart(pResolve);

        set(L.nodes, { opacity: (1 - unroll * 1.05).toFixed(3) });

        // The bloom's radius collapses, so the same pixels that spread out
        // compress back into the centre and grow denser as they go.
        const extent = lerp(1150, 96, fold);
        for (const c of L.fieldCells) {
          const dist = Math.hypot(c.cx - F.CORE.x, c.cy - F.CORE.y);
          const radial = clamp(1 - dist / 1150);
          const bloom = clamp((unroll - 0.03) * 2.1 - dist / 2600);
          // Sparse by design — at 60% coverage this reads as television
          // static, not as data. A bloom is mostly absence.
          const spread = radial * bloom * (0.1 + c.grain * 0.42);
          // Compressing: density rises as the radius shrinks.
          const gathered = dist < extent ? (0.55 + c.grain * 0.45) * clamp(1 - dist / 700) : 0;
          const density = lerp(spread, gathered, fold);
          const lit = density > c.threshold;
          set(c.rect, {
            fill: ACCENT,
            opacity: lit ? (1 - fold * 0.35).toFixed(3) : '0',
          });
        }
        set(L.field, { opacity: '1' });

        // ---- Beat 7: the field clears, the caret rises out of it, travels
        // back to where it started, and rests. The film closes the loop it
        // opened, so the last frame equals the first.
        const fadeField = outCubic(seg(pSeal, 0.18, 0.62));
        set(L.field, { opacity: (1 - fadeField).toFixed(3) });
        // The closing hairline is fully gone by 88% of the beat. It used to
        // still be fading at t=15.0, which meant the last frame was not the
        // first frame — a seam you see on every loop of a background video.
        // Ending it early also buys the dead hold the rhythm contract wants.
        set(L['rule2'], {
          width: (420 * outQuart(seg(pSeal, 0.42, 0.72))).toFixed(1),
          opacity: (outCubic(seg(pSeal, 0.5, 0.72)) * (1 - seg(pSeal, 0.78, 0.88))).toFixed(3),
        });

        return t;
      };

      window.__seek(0);
      window.__ready = true;
    </script>
  </body>
</html>
