<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 800"
     preserveAspectRatio="xMidYMid meet"
     data-aspect-ratio="2:1"
     data-mobile-policy="escala proporcional al ancho del contenedor, sin recorte ni reencuadre; el dibujo completo mide 390x195 a 390 px de ancho">
  <title>La traza — boceto (run-3)</title>
  <desc>Boceto barato de «La traza» (el registro: qué autorizó qué).
    RELACIÓN DE ASPECTO: 2:1. Tablero de 1600x800 unidades; la entrega usa el mismo encuadre
    (200x100 celdas a 8 px = 1600x800).
    POLÍTICA MÓVIL: escala proporcional al ancho del contenedor, sin recorte ni reencuadre; a 390 px
    el dibujo completo mide 390x195 y nada del sujeto sale del marco. La raíz declarada con
    width/height 100% + viewBox + preserveAspectRatio="xMidYMid meet" es lo que hace que la captura
    directa del archivo escale en vez de recortar.
    TINTA SOBRE CLARO: fondo blanco, trazo oscuro (el pipeline mide tinta; el suelo oscuro es del motor).
    Una capa por decisión: 1 base (campo apagado), 2 estructura (la cadena, en sombra), 3 sujeto
    (los nueve nodos), 4 recorrido (lo que la traza ya encendió), 5 evento (el acento único).</desc>

  <!-- capa 1 · base: el campo apagado. Rayado suave, no textura. -->
  <rect x="0" y="0" width="1600" height="800" fill="#ffffff"/>
  <g stroke="#e4e8ea" stroke-width="2" stroke-linecap="butt">
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
  </g>
  <g stroke="#eef1f2" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="700" x2="520" y2="700"/>
    <line x1="60" y1="730" x2="400" y2="730"/>
    <line x1="1100" y1="120" x2="1540" y2="120"/>
    <line x1="1220" y1="150" x2="1540" y2="150"/>
  </g>

  <!-- capa 2 · estructura: la cadena entera, siempre presente, en sombra. -->
  <polyline points="144,576 304,568 472,536 632,480 800,408 960,328 1128,272 1288,248 1456,240"
    fill="none" stroke="#c9d0d3" stroke-width="9" stroke-linecap="round"/>

  <!-- capa 4 · recorrido: lo que la traza ya encendió (nodos 0..4 y sus enlaces). -->
  <polyline points="144,576 304,568 472,536 632,480 800,408"
    fill="none" stroke="#2b3234" stroke-width="9" stroke-linecap="round"/>

  <!-- capa 3 · sujeto: nueve nodos. Encendido = relleno oscuro; sombra = sólo contorno. -->
  <g fill="#2b3234" stroke="#2b3234" stroke-width="4">
    <circle cx="144" cy="576" r="25"/>
    <circle cx="304" cy="568" r="25"/>
    <circle cx="472" cy="536" r="25"/>
    <circle cx="632" cy="480" r="25"/>
    <circle cx="800" cy="408" r="25"/>
  </g>
  <g fill="#ffffff" stroke="#b3bcbf" stroke-width="4">
    <circle cx="1128" cy="272" r="25"/>
    <circle cx="1288" cy="248" r="25"/>
    <circle cx="1456" cy="240" r="25"/>
  </g>

  <!-- capa 5 · evento: el acento único, encendido sobre el nodo que la traza acaba de autorizar. -->
  <circle cx="960" cy="328" r="34" fill="#ffffff" stroke="#2b3234" stroke-width="4"/>
  <circle cx="960" cy="328" r="21" fill="#2b3234"/>
  <g stroke="#2b3234" stroke-width="3" stroke-linecap="round">
    <line x1="960" y1="286" x2="960" y2="264"/>
    <line x1="960" y1="370" x2="960" y2="392"/>
    <line x1="918" y1="328" x2="896" y2="328"/>
    <line x1="1002" y1="328" x2="1024" y2="328"/>
  </g>
</svg>
