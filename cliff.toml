# git-cliff configuration file
# See https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{%- if commit.breaking %} **[breaking]**{% endif %}
{%- if commit.links %} ({{ commit.links | join(sep=", ") }}){% endif %}
{% endfor %}
{% endfor %}
"""
footer = """
{% if previous -%}
  {% if version -%}
    Full Changelog: [{{ version | trim_start_matches(pat="v") }}](https://github.com/{{ github.repository }}/compare/{{ previous }}...{{ version }})
  {%- else %}
    Full Changelog: [unreleased](https://github.com/{{ github.repository }}/compare/{{ previous }}...HEAD)
  {%- endif %}
{%- endif %}
<!-- generated by git-cliff -->
"""
# template defines the layout of the final changelog.
# Leave empty to use the default (header + version heading + body + footer).

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^docs", group = "<!-- 2 -->Documentation" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^perf", group = "<!-- 4 -->Performance" },
  { message = "^style", group = "<!-- 5 -->Style" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^chore", group = "<!-- 7 -->Chores" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
sort_commits = "oldest"
