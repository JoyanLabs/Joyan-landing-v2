name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: false
        default: "latest"

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish production image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: imagename
        # Use github.repository ("owner/name") so the image lands in the GHCR
        # namespace of whichever org/owner is running this workflow. The
        # repository_name property evaluates to empty for tag pushes, so we
        # slice github.repository instead. The vars.GHCR_IMAGE override lets a
        # host repo point at a mirror registry.
        run: |
          if [ -n "${{ vars.GHCR_IMAGE }}" ]; then
            echo "image=${{ vars.GHCR_IMAGE }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.imagename.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ inputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: deploy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
